repositories:
  - name: stakater
    url: https://stakater.github.io/stakater-charts
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: common-charts
    url: https://rishang.github.io/helm-charts/charts
  - name: sealed-secrets
    url: https://bitnami.github.io/sealed-secrets
  - name: rustfs
    url: https://charts.rustfs.com
  - name: jetstack
    url: https://charts.jetstack.io
  - name: devtron
    url: https://helm.devtron.ai
  - name: longhorn
    url: https://charts.longhorn.io
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: headlamp
    url: https://kubernetes-sigs.github.io/headlamp/
  - name: traefik
    url: https://traefik.github.io/charts

releases:
  # Reloader - watches changes in ConfigMap and Secret and does rolling upgrades
  # ref: https://github.com/stakater/Reloader
  - name: reloader
    namespace: ops
    createNamespace: true
    chart: stakater/reloader
    version: 2.2.14

  # Metrics Server - metrics server for Kubernetes
  # ref: https://github.com/kubernetes-sigs/metrics-server
  - name: metrics-server
    namespace: kube-system
    createNamespace: true
    chart: metrics-server/metrics-server
    version: 3.13.1
    values:
      - args:
          - --kubelet-insecure-tls
          - --kubelet-preferred-address-types=InternalIP,Hostname,InternalDNS

    # version: v0.6.4  # uncomment to specify version 

  # External Secrets Operator - integrates external secret management systems
  # ref: https://external-secrets.io/
  - name: external-secrets
    namespace: ops
    createNamespace: true
    chart: external-secrets/external-secrets
    version: 2.8.0
    set:
      - name: installCRDs
        value: true

  # Loki Stack - logs, metrics, Grafana, and Alloy
  # ref: https://artifacthub.io/packages/helm/common-charts/loki-stack
  - name: loki-stack
    namespace: monitoring
    createNamespace: true
    chart: common-charts/loki-stack
    version: 1.0.3
    values:
      - rustfs:
          enabled: false

  # RustFS - S3-compatible object storage
  # ref: https://artifacthub.io/packages/helm/rustfs/rustfs
  - name: rustfs
    namespace: rustfs
    createNamespace: true
    chart: rustfs/rustfs
    version: 0.12.0
    values:
      - mode:
          standalone:
            enabled: true
          distributed:
            enabled: false
        ingress:
          enabled: false
        secret:
          rustfs:
            access_key: admin
            secret_key: admin

  # Mailpit - development SMTP server and web UI
  # ref: https://github.com/axllent/mailpit
  - name: mailpit
    namespace: mailpit
    createNamespace: true
    chart: common-charts/component-chart
    version: 0.0.1
    values:
      - containers:
          - name: mailpit
            image: axllent/mailpit
            imageTag: v1.30.6
            ports:
              - name: smtp
                containerPort: 1025
              - name: web
                containerPort: 8025
        service:
          ports:
            - name: smtp
              port: 1025
              containerPort: 1025
            - name: web
              port: 8025
              containerPort: 8025

  # Cert Manager - certificate management
  # ref: https://cert-manager.io/docs/
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.21.1
    disableValidation: true
    set:
      - name: crds.enabled
        value: true
    # version: v1.10.1  # uncomment to specify version

  # Devtron - GitOps platform
  # ref: https://docs.devtron.ai/
  - name: devtron
    namespace: devtroncd
    createNamespace: true
    chart: devtron/devtron-operator
    version: 0.23.3
    values:
      - installer:
          modules:
            - cicd
        argo-cd:
          enabled: true

  # Longhorn - distributed block storage for Kubernetes
  # ref: https://longhorn.io/
  - name: longhorn
    namespace: longhorn-system
    createNamespace: true
    chart: longhorn/longhorn
    version: 1.12.0

  # Argo CD
  # ref: https://artifacthub.io/packages/helm/argo/argo-cd
  - name: argo-cd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    version: 10.2.1
    values:
      - configs:
          params:
            server.insecure: true

  # Sealed Secrets - encrypt Secrets for safe Git storage
  # ref: https://artifacthub.io/packages/helm/bitnami-labs/sealed-secrets
  - name: sealed-secrets
    namespace: kube-system
    createNamespace: true
    chart: sealed-secrets/sealed-secrets
    version: 2.19.1
    values:
      - fullnameOverride: sealed-secrets-controller

  # Headlamp - Kubernetes UI
  # ref: https://artifacthub.io/packages/helm/headlamp/headlamp
  - name: headlamp
    namespace: kube-system
    createNamespace: true
    chart: headlamp/headlamp
    version: 0.44.0

  # Envoy Gateway - Kubernetes-native API Gateway
  # ref: https://gateway.envoyproxy.io/
  - name: envoy-gateway
    namespace: envoy-gateway
    createNamespace: true
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: 1.8.3
    disableValidation: true
    hooks:
      - events: ["postsync"]
        command: "bash"
        args:
          - "-c"
          - |
            kubectl apply -f https://github.com/envoyproxy/gateway/releases/download/latest/quickstart.yaml -n default
        showlogs: true

  # Traefik - Modern HTTP reverse proxy and load balancer
  # ref: https://doc.traefik.io/traefik/
  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: traefik/traefik
    version: 41.1.0

  # NGINX Ingress Controller (Open Source)
  # ref: https://docs.nginx.com/nginx-ingress-controller/install/helm/open-source/
  - name: nginx-ingress
    namespace: nginx-ingress
    createNamespace: true
    chart: oci://ghcr.io/nginx/charts/nginx-ingress
    version: 2.6.4
    disableValidation: true
